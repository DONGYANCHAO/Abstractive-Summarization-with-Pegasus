[flake8]
max-line-length = 100
exclude = 
    __pycache__,
    .git,
    venv,
    .venv,
    env,
    build,
    dist,
    *.egg-info
ignore = E203, W503

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short

[coverage:run]
source = .
omit = 
    tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
